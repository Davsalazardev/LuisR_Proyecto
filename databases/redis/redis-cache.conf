# ==============================================================================
# Redis 7 — Instancia de Caché Cache-Aside (Servicio de Catálogo)
# ==============================================================================
# Caché efímera pura: sin persistencia en disco (máxima velocidad) y política
# allkeys-lru para desalojar entradas antiguas si se alcanza el límite de RAM.
# ==============================================================================

bind 0.0.0.0
protected-mode yes
port 6379
timeout 120
tcp-keepalive 60

# Límite conservador para compartir EC2 t3.micro con MongoDB si se requiere
maxmemory 128mb
maxmemory-policy allkeys-lru

# Caché pura: no necesita persistencia en disco
save ""
appendonly no

rename-command FLUSHALL ""
rename-command CONFIG ""
