# ==============================================================================
# Redis 7 — Instancia de Carrito y Sesiones (Servicio de Carrito)
# ==============================================================================
# Persistencia AOF habilitada para no perder carritos activos en reinicios.
# Política de memoria: volatile-lru (solo expulsa claves con TTL).
# Seguridad: requiere contraseña (inyectada vía --requirepass en docker-compose)
# y escucha únicamente dentro de la red privada del Security Group.
# ==============================================================================

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# Límites adecuados para EC2 t3.micro / t2.micro (1 GB RAM total)
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistencia duradera moderada para carritos/sesiones
appendonly yes
appendfsync everysec
save 900 1
save 300 10

# Deshabilitar comandos destructivos en producción
rename-command FLUSHALL ""
rename-command CONFIG ""
